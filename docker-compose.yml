services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: straume
      POSTGRES_PASSWORD: straume
      POSTGRES_DB: straume
    ports:
      - "5432:5432"
    volumes:
      - straume-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U straume -d straume"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: straume
      MINIO_ROOT_PASSWORD: straume-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - straume-minio:/data

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://straume:straume@db:5432/straume
      AUTH_SECRET: dev-only-not-a-secret-change-in-prod-32b
      SEED_PASSWORD: bytt-meg-lokalt
      NEXT_PUBLIC_SHOW_DEMO_LOGIN: "1"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-north-1
      S3_BUCKET: straume
      S3_ACCESS_KEY: straume
      S3_SECRET_KEY: straume-dev-secret
      DATA_DIR: /app/.data
      WINNER_EMAIL: tegner@example.com
      MAIL_PROVIDER: log
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      COOKIE_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  straume-pg:
  straume-minio:
