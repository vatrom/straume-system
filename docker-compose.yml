services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: straume
      POSTGRES_PASSWORD: straume
      POSTGRES_DB: straume
    ports:
      - "5432:5432"
    volumes:
      - straume-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U straume -d straume"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://straume:straume@db:5432/straume
      AUTH_SECRET: dev-only-not-a-secret-change-in-prod-32b
      SEED_PASSWORD: bytt-meg-lokalt
      NEXT_PUBLIC_SHOW_DEMO_LOGIN: "1"
      # Tom S3_ENDPOINT lagrer filer på disk i DATA_DIR. Se README for valgfri S3-tjeneste.
      S3_ENDPOINT: ""
      DATA_DIR: /app/.data
      WINNER_EMAIL: tegner@example.com
      MAIL_PROVIDER: log
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      COOKIE_SECURE: "0"
    volumes:
      - straume-data:/app/.data
    depends_on:
      db:
        condition: service_healthy

volumes:
  straume-pg:
  straume-data:
